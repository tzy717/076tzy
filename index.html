<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>滑动门页面</title>
<style>
  body { margin:0; padding:40px; background:#f4f4f4;
         font-family:"Microsoft YaHei", sans-serif; color:#333; }
  h1 { font-size:26px; margin-bottom:24px; }

  /* 每条门片：竖向排列 */
  .item {
    width: 320px;            /* 收起时宽度 */
    height: 90px;
    background:#fff;
    border:1px solid #ddd;
    margin-bottom:10px;
    display:flex;
    overflow:hidden;         /* 收起时藏住右边内容 */
    transition:width 0.5s;   /* 宽度变化做动画 */
    cursor:pointer;
  }

  /* 鼠标移上去：横向展开 */
  .item:hover { width:900px; border-color:#1f6b4f; }

  /* 左侧一级标题 */
  .left {
    flex:0 0 210px; padding:0 15px;
    display:flex; align-items:center; font-size:18px;
  }

  /* 右侧二级标题 */
  .right {
    flex:1; opacity:0; transition:opacity 0.4s;
    display:flex; align-items:center; gap:12px; padding-right:20px;
  }
  .item:hover .right { opacity:1; }

  .right span {
    padding:8px 12px; background:#eef5f1;
    border-left:3px solid #1f6b4f; font-size:14px; white-space:nowrap;
  }
</style>
</head>
<body>

  <h1>四川美食</h1>

  <div class="item">
    <div class="left">01 经典川菜</div>
    <div class="right">
      <span>麻婆豆腐</span><span>回锅肉</span><span>水煮鱼</span>
    </div>
  </div>

  <div class="item">
    <div class="left">02 市井小吃</div>
    <div class="right">
      <span>担担面</span><span>钵钵鸡</span><span>龙抄手</span>
    </div>
  </div>

  <div class="item">
    <div class="left">03 地方风味</div>
    <div class="right">
      <span>宜宾燃面</span><span>冷吃兔</span><span>甜皮鸭</span>
    </div>
  </div>

</body>
</html>
